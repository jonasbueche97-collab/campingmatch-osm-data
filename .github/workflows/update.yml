name: OSM Garda public data
on:
  push:
    paths:
      - extract.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osm-garda
  cancel-in-progress: false
jobs:
  extract:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python extract.py /tmp/garda-osm
      - name: Publish ground data only
        run: |
          mkdir -p data
          cp /tmp/garda-osm/garda-overpass-compatible.json data/garda.json
          cp /tmp/garda-osm/manifest.json data/manifest.json
          git config user.name 'OSM data updater'
          git config user.email 'osm-data@users.noreply.github.com'
          git add data/garda.json data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update licensed OSM Garda snapshot'
          git push
